name: Build port nativo android

# APK para programas com 'inclua layoutnativos'.
# Lógica: .port -> C -> programa.so (ndk-build). Telas: .ui em assets. Sem SDL, sem Kotlin.

on:
  workflow_call:
    inputs:
      programa:
        type: string
        default: ''
      nome:
        type: string
        default: programa
      pasta:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      programa:
        description: Caminho do .port (vazio = o programa do app.yml)
        default: ''
      nome:
        description: Nome do APK
        default: programa
      pasta:
        description: Pasta com o app.yml (vazio = raiz)
        default: testes/android-nativo

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROGRAMA_IN: ${{ inputs.programa }}
      NOME_APK: ${{ inputs.nome }}
      PASTA: ${{ inputs.pasta }}
      MODELO: portugol/modelos/android-nativo
      NDK_VERSAO: 26.1.10909125
    steps:
      - name: Checkout do projeto
        uses: actions/checkout@v4
        with:
          path: projeto

      - name: Checkout do PortugolTipado (motor)
        uses: actions/checkout@v4
        with:
          repository: adilson889/PortugolTipado
          ref: main
          path: portugol

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Ler e validar o app.yml
        run: |
          BASE="projeto"
          if [ -n "$PASTA" ]; then BASE="projeto/$PASTA"; fi
          echo "BASE_APP=$BASE" >> "$GITHUB_ENV"
          APP=""
          for f in "$BASE/app.yml" "$BASE/app.yaml"; do
            if [ -f "$f" ]; then APP="$f"; break; fi
          done
          if [ -z "$APP" ]; then
            echo "::error title=app.yml::Falta o app.yml em $BASE."
            exit 1
          fi
          python3 portugol/scripts/app_yml.py "$APP" --saida "$GITHUB_ENV" \
            --manifesto "$MODELO/app/src/main/AndroidManifest.xml"
          if ! grep -qiE '^[[:space:]]*orienta' "$APP"; then
            echo "APP_ORIENTACAO=sensorPortrait" >> "$GITHUB_ENV"
          fi

      - name: Compilar o motor
        working-directory: portugol/core
        run: gradle fatJar --no-daemon

      - name: Transpilar .port para .c
        run: |
          if [ -n "$PROGRAMA_IN" ]; then
            FONTE="projeto/$PROGRAMA_IN"
          else
            FONTE="$BASE_APP/$APP_PROGRAMA"
          fi
          java -jar portugol/core/build/libs/port.jar -o programa.c "$FONTE"

      - name: Preparar o projeto Android (nativo)
        run: |
          mkdir -p "$MODELO/app/jni/src"
          cp programa.c "$MODELO/app/jni/src/programa.c"
          # Os .ui vão como estão (a conversão para template vem depois)
          A="$MODELO/app/src/main/assets/ui"
          mkdir -p "$A"
          rsync -am --include='*/' --include='*.ui' --exclude='*' "$BASE_APP/" "$A/"
          find "$MODELO/app/src/main/assets" -type f

      - name: Icone
        run: |
          pip install pillow
          if [ -n "$APP_ICONE" ]; then ICONE="$BASE_APP/$APP_ICONE"; else ICONE="-"; fi
          python3 portugol/scripts/preparar_icone.py "$ICONE" "$MODELO/app/src/main/res"

      - name: NDK em cache
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSAO }}
          key: ndk-${{ env.NDK_VERSAO }}

      - name: Instalar o SDK e o NDK (só o que falta)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            SDKM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          fi
          PACOTES="platforms;android-34 build-tools;34.0.0"
          if [ ! -d "$ANDROID_HOME/ndk/$NDK_VERSAO" ]; then
            PACOTES="$PACOTES ndk;$NDK_VERSAO"
          fi
          printf 'y\n%.0s' {1..20} | "$SDKM" --install $PACOTES

      - name: Compilar o APK
        working-directory: ${{ env.MODELO }}
        env:
          ORG_GRADLE_PROJECT_appNome: ${{ env.APP_NOME }}
          ORG_GRADLE_PROJECT_appPacote: ${{ env.APP_PACOTE }}
          ORG_GRADLE_PROJECT_appVersao: ${{ env.APP_VERSAO }}
          ORG_GRADLE_PROJECT_appVersionCode: ${{ env.APP_VERSION_CODE }}
          ORG_GRADLE_PROJECT_appOrientacao: ${{ env.APP_ORIENTACAO }}
          ORG_GRADLE_PROJECT_appApiAlvo: ${{ env.APP_SDK_ALVO }}
          ORG_GRADLE_PROJECT_appApiMinima: ${{ env.APP_SDK_MINIMO }}
        run: gradle assembleDebug --no-daemon

      - name: Guardar o APK
        run: |
          mkdir -p saida
          cp "$MODELO/app/build/outputs/apk/debug/app-debug.apk" "saida/${NOME_APK}.apk"

      - name: Publicar o APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.nome }}-android
          path: saida/
