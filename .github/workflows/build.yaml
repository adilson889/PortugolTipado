name: Build
run-name: Build ${{ inputs.id }}

on:
  workflow_dispatch:
    inputs:
      id:
        description: Identificador do pedido
        required: true
      programa:
        description: Caminho do .port
        required: true
      nome:
        description: Nome do executavel
        default: programa
      alvo:
        description: Plataformas a compilar
        type: choice
        options:
          - desktop
          - android
          - linux
          - windows
          - todos
        default: desktop
      pasta:
        description: Pasta do projeto com o app.yml (vazio = raiz)
        default: ''

permissions:
  contents: read

jobs:
  desktop:
    if: ${{ inputs.alvo != 'android' }}
    uses: adilson889/PortugolTipado/.github/workflows/build-port-desktop.yaml@main
    with:
      programa: ${{ inputs.programa }}
      nome: ${{ inputs.nome }}
      so: ${{ inputs.alvo == 'linux' && 'linux' || inputs.alvo == 'windows' && 'windows' || 'todos' }}

  android:
    if: ${{ inputs.alvo == 'android' || inputs.alvo == 'todos' }}
    uses: adilson889/PortugolTipado/.github/workflows/build-port-android.yaml@main
    with:
      programa: ${{ inputs.programa }}
      nome: ${{ inputs.nome }}
      pasta: ${{ inputs.pasta }}