name: Build desktop

on:
  workflow_dispatch:
    inputs:
      programa:
        description: Caminho do .c gerado
        default: modelos/projeto-desktop/programa.c
      nome:
        description: Nome do executável
        default: programa
  workflow_call:
    inputs:
      programa:
        type: string
        default: programa.c
      nome:
        type: string
        default: programa
      versao:
        description: Tag ou ramo do PortugolTipado com a runtime gráfica
        type: string
        default: main

permissions:
  contents: read

env:
  PROGRAMA: ${{ inputs.programa }}
  NOME: ${{ inputs.nome }}
  VERSAO: ${{ inputs.versao || 'main' }}

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do projeto
        uses: actions/checkout@v4
        with:
          path: projeto
      - name: Checkout do PortugolTipado (runtime)
        uses: actions/checkout@v4
        with:
          repository: adilson889/PortugolTipado
          ref: ${{ env.VERSAO }}
          path: portugol
      - name: Instalar SDL2
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-ttf-dev
      - name: Compilar
        run: |
          RT=portugol/modelos/desktop-exe
          mkdir -p saida
          gcc -O2 -o "saida/$NOME" "projeto/$PROGRAMA" "$RT/graficos.c" \
            -I"$RT" $(pkg-config --cflags --libs sdl2 SDL2_ttf) -lm
          cp "$RT/DEJAVU-LICENSE" saida/
      - name: Guardar binário Linux
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NOME }}-linux
          path: saida/

  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout do projeto
        uses: actions/checkout@v4
        with:
          path: projeto
      - name: Checkout do PortugolTipado (runtime)
        uses: actions/checkout@v4
        with:
          repository: adilson889/PortugolTipado
          ref: ${{ env.VERSAO }}
          path: portugol
      - name: Preparar MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-SDL2_ttf
      - name: Compilar
        shell: msys2 {0}
        run: |
          RT=portugol/modelos/desktop-exe
          mkdir -p saida
          # O programa tem o seu proprio main: tira o SDL_main e o modo sem consola
          CFLAGS=$(pkg-config --cflags sdl2 SDL2_ttf | sed 's/-Dmain=SDL_main//')
          LIBS=$(pkg-config --libs sdl2 SDL2_ttf | sed -e 's/-mwindows//' -e 's/-lSDL2main//')
          gcc -O2 -o "saida/$NOME.exe" "projeto/$PROGRAMA" "$RT/graficos.c" \
            -I"$RT" $CFLAGS $LIBS -lm
          # Copia as DLLs de que o executavel depende
          ldd "saida/$NOME.exe" | grep -i ucrt64 | awk '{print $3}' | xargs -I{} cp "{}" saida/
          cp "$RT/DEJAVU-LICENSE" saida/
      - name: Guardar binário Windows
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NOME }}-windows
          path: saida/