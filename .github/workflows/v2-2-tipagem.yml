name: V2.2 - analise de tipos

on:
  push:
    branches:
      - feature/v2-2-analise-tipos
  workflow_dispatch:

concurrency:
  group: tipos-v22
  cancel-in-progress: true

jobs:
  compilar-e-validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar o compilador em Kotlin
        working-directory: core
        run: gradle fatJar --no-daemon
      - name: Executar regressao semantica e GCC
        run: bash tests/v2-2-tipos.sh
