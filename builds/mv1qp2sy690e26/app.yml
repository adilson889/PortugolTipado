# Configuracao da aplicacao Android (APK)
# Cada linha eh "campo: valor". O que vem depois de # eh comentario.
# Para usar uma opcao comentada, apague o "# " do inicio da linha
# (e comente ou apague a linha do mesmo campo que estava ativa).

# ---------------- Identificacao ----------------

# Nome que aparece no telemovel. Obrigatorio.
# Ate 30 caracteres, sem os simbolos < > & " '
nome: TesteLogin

# Identificador unico do app. So minusculas, numeros e _,
# em blocos separados por pontos. Se apagar a linha, eh criado a partir do nome.
pacote: co.adilson889.apps.testelogin

# Versao no formato 1.2.3 (cada numero de 0 a 99).
# O codigo de versao eh calculado a partir dela. Aumente a cada publicacao.
versao: 1.0.3

# Icone: ficheiro PNG dentro do projeto, quadrado, minimo 192x192 (ideal 512x512).
# Sem esta linha, usa o icone padrao do PortugolTipado.
# icone: icone.png

# ---------------- Programa ----------------

# Ficheiro onde o programa comeca. Por defeito eh principal.port.
programa: principal.port
# programa: inicio.port

# Orientacao do ecra: horizontal, vertical ou automatica.
# Por defeito eh horizontal (no workflow de interface, vertical).
orientacao: vertical
# orientacao: horizontal
# orientacao: automatica

# ---------------- Janela ----------------

# Ecra inteiro, sem barra de estado (hora, bateria, operadora) nem barra de
# navegacao. As barras aparecem so ao deslizar da borda. sim ou nao.
# Por defeito eh sim.
telaCheia: sim
# telaCheia: nao

# Cor das barras quando visiveis, em hexadecimal e entre aspas.
# Por defeito eh "#000000".
corBarraEstado: "#000000"
corBarraNavegacao: "#000000"
# corBarraEstado: "#FFFFFF"
# corBarraNavegacao: "#FFFFFF"

# Cor de fundo da janela antes do primeiro desenho.
# Por defeito eh "#000000".
corFundo: "#F0EEE8"
# corFundo: "#000000"
# corFundo: "#FFFFFF"

# Manter o ecra ligado enquanto o app esta aberto. sim ou nao.
# Por defeito eh sim.
manterTelaLigada: sim
# manterTelaLigada: nao

# ---------------- Versoes de Android ----------------

# sdkMinimo: versao minima suportada (minimo 21).
#   21 = Android 5.0, 24 = Android 7.0, 26 = Android 8.0, 29 = Android 10.
# sdkAlvo: versao para a qual o app eh compilado. 34 eh o Android 14.
sdkMinimo: 24
# sdkMinimo: 21
# sdkMinimo: 26
# sdkMinimo: 29
sdkAlvo: 34

# ---------------- Permissoes ----------------

# Nomes separados por virgulas. Os de dois nomes usam ponto.
# Por defeito nenhuma. Se o programa usa imagens ou links da internet, ponha internet.
#
# Rede:          internet, rede.estado, wifi.estado,
#                bluetooth, bluetooth.conectar, bluetooth.procurar, nfc
# Hardware:      vibrar, camera, microfone
# Localizacao:   localizacao, localizacao.aproximada
# Notificacoes:  notificacoes
# Mensagens:     ler.sms, enviar.sms, receber.sms
# Contactos:     ler.contactos, escrever.contactos
# Chamadas:      ligar, ler.telefone, ler.chamadas, escrever.chamadas
# Calendario:    ler.calendario, escrever.calendario
# Ficheiros:     ler.imagens, ler.videos, ler.audio,
#                ler.armazenamento, escrever.armazenamento
# Sistema:       manter.acordado, iniciar.arranque,
#                sensores.corpo, reconhecer.actividade
permissoes: internet
# permissoes: internet, vibrar
# permissoes: internet, camera, microfone
# permissoes: internet, ler.sms, enviar.sms, receber.sms
# permissoes: internet, ler.contactos, localizacao