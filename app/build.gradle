plugins {
    id 'com.android.application'
}

// Os valores vêm do app.yml, passados pelo workflow como variáveis de ambiente
// ORG_GRADLE_PROJECT_appNome, appPacote, appVersao, appVersionCode e appOrientacao.
def prop = { String nome, String padrao -> (project.findProperty(nome) ?: padrao).toString() }

android {
    namespace 'co.adilson889.portugoltipado.apk'
    compileSdk 34
    ndkVersion '26.1.10909125'

    defaultConfig {
        applicationId prop('appPacote', 'co.adilson889.apps.programa')
        minSdk 21
        targetSdk 34
        versionCode prop('appVersionCode', '1').toInteger()
        versionName prop('appVersao', '1.0.0')
        manifestPlaceholders = [
            appNome    : prop('appNome', 'PortugolTipado'),
            orientacao : prop('appOrientacao', 'sensorLandscape')
        ]
        externalNativeBuild {
            ndkBuild {
                // arm64-v8a cobre praticamente todos os telemóveis recentes; junta x86_64 para emulador.
                abiFilters 'arm64-v8a'
                arguments 'APP_PLATFORM=android-21'
            }
        }
    }

    externalNativeBuild {
        ndkBuild {
            path 'jni/Android.mk'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
